name: Deploy frontend to GitHub Pages

# NOTE: GitHub Pages serves static files only and cannot run the FastAPI
# backend. This workflow publishes the React frontend. For the deployed site to
# load real data, host the backend separately and set the repository variable
# VITE_API_BASE to its public URL (for example https://your-backend.onrender.com/api).
# Without it the site renders but every API call fails, which is expected.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build -- --base=/EVBatteryHealth-HTTM.github.io/

      - name: Add SPA fallback
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
